apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /openapi
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /saude
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
