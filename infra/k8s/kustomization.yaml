apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina
resources:
  - namespace.yaml
  - api.yaml
  - ingress.yaml
configMapGenerator:
  - name: api
    literals:
      - Keycloak__Authority=http://keycloak:8080/auth/realms/oficina
      - Keycloak__Audience=oficina-api
      - Keycloak__ClienteSwagger=oficina-swagger
      - Keycloak__ExigirHttps=false
      - Email__Host=mailpit
      - Email__Porta=1025
      - Email__Tls=None
    envs:
      - ambiente.env
secretGenerator:
  - name: api
    envs:
      - segredos.env
images:
  - name: oficina-api
    newName: oficina-api
