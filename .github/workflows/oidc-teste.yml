name: Teste OIDC

on:
  push:
    branches: [integration/infra-fase-2]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  identidade:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws sts get-caller-identity
